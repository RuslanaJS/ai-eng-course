name: Evals

# The RAG bot on the questions that the committed corpus (the laws) can answer, compared with
# evals/baseline_open.json. Runs on a pull request that changes what the answers depend on, and by hand.
# Costs about 0.1 USD per run (Haiku 4.5, about 23 questions); the reports of the full corpus are not
# in the repository, so the full evaluation runs locally (make eval-answers).

on:
  pull_request:
    paths:
      - "prompts/rag_answer_*.md"
      - "src/propdoc/answering/**"
      - "src/propdoc/retrieval/**"
      - "src/propdoc/evaluation/**"
      - "evals/questions.json"
      - "evals/baseline_open.json"
      - "data/processed/chunks.jsonl"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  answers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip without keys
        id: keys
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "No API keys (a pull request from a fork, or secrets not set): skipping the live run."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.keys.outputs.ok == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Install the project
        if: steps.keys.outputs.ok == 'true'
        run: uv python install && uv sync --locked

      # Embeddings of the law chunks and the reranker model: computed once, then reused
      - name: Cache embeddings and models
        if: steps.keys.outputs.ok == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/cache
          key: evals-${{ hashFiles('data/processed/chunks.jsonl') }}-v1

      - name: Answers and gate against the baseline
        if: steps.keys.outputs.ok == 'true'
        run: uv run python -m propdoc.evaluation.answers --open --gate

      - name: Upload the run
        if: always() && steps.keys.outputs.ok == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: answers-open
          path: evals/runs/answers_*_open*
          if-no-files-found: ignore
