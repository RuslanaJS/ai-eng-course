[project]
name = "propdoc"
version = "0.1.0"
description = "PropDoc: structured extraction and RAG over Polish real-estate documents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "anthropic>=0.40",
    "ollama>=0.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "google-genai>=2.34.0",
    "certifi>=2026.7.22",
    "pdfplumber>=0.11.10",
    "beautifulsoup4>=4.15.0",
    "fastembed>=0.9.1",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "tiktoken>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/propdoc"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
